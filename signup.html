<!DOCTYPE html>
<html>

<head> 
    <title>Join SPECS - Signup</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="signup-page">
        <div class="signup-nav">
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
        
        <div class="signup-container">
            <h1>Join SPECS</h1>
            <p>Sign up to become a member of our computer science community!</p>
            
            <!-- Success message area -->
            <div id="signup-success" class="success-message" style="display: none;">
                <h3>🎉 Welcome to SPECS!</h3>
                <p>Thank you for joining! We've received your signup and will be in touch soon.</p>
                <div class="success-actions">
                    <button id="submit-another" class="submit-btn secondary-btn">Submit Another Form</button>
                    <a href="index.html" class="back-home-btn">Back to Home</a>
                </div>
            </div>
            
            <form id="specsSignupForm" class="signup-form" action="https://formspree.io/f/mandgavg" method="POST">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                
                <div class="form-group">
                    <label for="gradeLevel">Grade Level:</label>
                    <select id="gradeLevel" name="gradeLevel" required>
                        <option value="">Select your grade</option>
                        <option value="9">9th Grade</option>
                        <option value="10">10th Grade</option>
                        <option value="11">11th Grade</option>
                        <option value="12">12th Grade</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="experience">Programming Experience:</label>
                    <select id="experience" name="experience" required>
                        <option value="">Select your level</option>
                        <option value="none">No experience</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="interests">What interests you about computer science?</label>
                    <textarea id="interests" name="interests" rows="4" placeholder="Tell us what excites you about CS..."></textarea>
                </div>
                
                <!-- Hidden fields for Formspree -->
                <input type="hidden" name="_subject" value="New SPECS Club Signup">
                <input type="hidden" name="_next" value="https://specsmasters.github.io/website/signup.html#signup-success">
                <input type="hidden" name="_cc" value="">
                
                <button type="submit" class="submit-btn">Join SPECS!</button>
            </form>
            
            <!-- Alternative: Button for EmailJS fallback -->
            <div class="fallback-info" style="display: none;">
                <p style="font-size: 0.9em; color: #666; margin-top: 15px; text-align: center;">
                    Having trouble submitting? <a href="mailto:specs@masters.edu?subject=SPECS Club Signup&body=Hi! I'd like to join SPECS. Here are my details:%0D%0A%0D%0AName: %0D%0AEmail: %0D%0AGrade: %0D%0AExperience: %0D%0AInterests: " style="color: #007bff;">Email us directly</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Handle SPECS signup form submission
        document.getElementById('specsSignupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(this);
            const firstName = formData.get('firstName');
            const lastName = formData.get('lastName');
            
            // Show loading state
            const submitBtn = this.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;
            
            // Submit to Formspree
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    // Show success message
                    document.getElementById('signup-success').style.display = 'block';
                    this.style.display = 'none';
                    
                    // Scroll to success message
                    document.getElementById('signup-success').scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center' 
                    });
                } else {
                    throw new Error('Network response was not ok');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Sorry, there was an error submitting your form. Please try again or contact us directly.');
            })
            .finally(() => {
                // Reset button state
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });

        // Handle "Submit Another Form" button
        document.getElementById('submit-another').addEventListener('click', function() {
            // Hide success message and show form again
            document.getElementById('signup-success').style.display = 'none';
            document.getElementById('specsSignupForm').style.display = 'block';
            
            // Reset form
            document.getElementById('specsSignupForm').reset();
            
            // Scroll to form
            document.getElementById('specsSignupForm').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        });

        // Check for success redirect from Formspree
        if (window.location.hash === '#signup-success') {
            document.getElementById('signup-success').style.display = 'block';
            document.getElementById('specsSignupForm').style.display = 'none';
        }
    </script>
</body>

</html>
